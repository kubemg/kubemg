# KubeMG Dumb Agent — Kustomize base.
#
# This is a template, not a directly applicable root: the four __PLACEHOLDER__
# values are filled in by the KubeMG bastion when it renders an installation
# package for a specific cluster (see deploy/kustomize/README.md).
#
# The bastion's copy of these files lives at backend/pkg/agentpkg/base/ so it
# can be embedded into the server binary. `make manifest-check` fails the build
# if the two ever drift apart — edit both, or neither.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: __AGENT_NAMESPACE__

resources:
  - namespace.yaml
  - rbac.yaml
  - secret.yaml
  - deployment.yaml

# includeSelectors is off deliberately: a Deployment's selector is immutable
# after creation, so folding these labels into it would make any future label
# change an un-appliable one. The Deployment declares its own selector.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: kubemg-agent
      app.kubernetes.io/part-of: kubemg
      app.kubernetes.io/managed-by: kubemg
