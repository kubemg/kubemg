<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14161a" />
    <title>kubemg</title>
    <!-- The deck the operator chose is applied before first paint, so a light
         deck never flashes dark on the way in. Kept as a same-origin file
         rather than inline so script-src 'self' covers it with no
         'unsafe-inline' exception — see public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/commit-mono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
