<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1017" />
    <title>KubeMG</title>
    <!-- The deck the operator chose is applied before first paint, so a light
         deck never flashes dark on the way in. -->
    <script>
      try {
        if (localStorage.getItem('kubemg.theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (error) {
        /* Private browsing refuses storage; dark is the default anyway. */
      }
    </script>
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
