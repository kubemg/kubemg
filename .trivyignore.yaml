misconfigurations:
  - id: AVD-KSV-0046
    paths:
      - "deploy/kustomize/base/rbac.yaml"
      - "backend/pkg/agentpkg/base/rbac.yaml"
    statement: >-
      resources: ["*"] only reaches the enumerated, non-core API groups these
      ClusterRoles document (Gateway API + Istio) -- never the core group,
      where Secrets live. Wildcarding resource *kinds* within that
      already-narrow group list is a deliberate trade-off explained in the
      manifest's own comments, not an oversight.

  - id: AVD-DS-0002
    paths:
      - "backend/Dockerfile.dev"
      - "frontend/Dockerfile.dev"
    statement: >-
      Dev-only images built solely by `make up` / docker-compose.yml against
      a bind-mounted source tree and a shared dependency-cache volume;
      running as the image's default root keeps those volumes writable
      without matching host UIDs. Neither Dockerfile is built or shipped
      anywhere else.
