services:
  postgres:
    image: postgres:16-alpine
    container_name: kubemg-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=kubemg
      - POSTGRES_USER=kubemg
      - POSTGRES_PASSWORD=kubemg_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubemg -d kubemg"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kubemg-backend
    ports:
      - "8443:8443"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # The self-signed certificate survives a rebuild, so agents already
      # holding a pinned copy of it keep connecting.
      - tls-certs:/etc/kubemg/tls
      # Session recordings have to outlive the container: a replay that vanishes
      # on the next deploy is not audit evidence.
      - session-recordings:/var/lib/kubemg/recordings
    environment:
      - GIN_MODE=debug
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kubemg
      - DB_PASSWORD=kubemg_secret
      - DB_NAME=kubemg
      - DB_SSLMODE=disable
      - JWT_SECRET=kubemg_dev_secret_change_me
      - KUBEMG_ADMIN_USERNAME=admin
      - KUBEMG_ADMIN_PASSWORD=admin
      - KUBEMG_SA_NAMESPACE=kubemg-system
      # Every origin the console is opened from. Reaching the dev stack from
      # another machine means adding that address here — put it in an untracked
      # `.env` next to this file rather than editing the default in git.
      - CORS_ALLOWED_ORIGINS=${KUBEMG_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # TLS is not optional for kubectl: client-go refuses to send a bearer
      # token over plain http, so a plaintext bastion cannot serve a generated
      # kubeconfig or an exec session at all. The certificate is minted on
      # first boot and pinned into every agent install package; swap in a real
      # one by mounting it over /etc/kubemg/tls and the pinning stops.
      - KUBEMG_LISTEN_ADDR=:8443
      - KUBEMG_TLS_ENABLED=true
      - KUBEMG_TLS_SELF_SIGNED=true
      # Extra SANs. The public URL's host and loopback are always covered; add
      # every other address the console, kubectl and your agents dial.
      - KUBEMG_TLS_HOSTS=${KUBEMG_TLS_HOSTS:-kubemg-backend,backend}
      # Production: the chain agents must trust, when it is not one the public
      # CAs vouch for. An internal corporate PKI is the case this exists for —
      # it is not self-signed, so nothing here could infer that agents need it,
      # and without it every agent fails its handshake with x509. Mount the PEM
      # in and name it; it overrides the self-signed pinning above, and applies
      # even when TLS is terminated by an ingress rather than by this process.
      # - KUBEMG_AGENT_CA_BUNDLE=/etc/kubemg/tls/agent-ca.pem
      # Baked into every generated agent install command, so it has to be the
      # address the target cluster can reach — not the container's own, and not
      # loopback once a real cluster is attaching. Override it in `.env`.
      - KUBEMG_PUBLIC_URL=${KUBEMG_PUBLIC_URL:-https://localhost:8443}
      # Published as a multi-arch index (linux/amd64 + linux/arm64) by
      # `make agent-push`, because the clusters this is applied to include
      # Graviton and Ampere nodes that an amd64-only tag fails on.
      - KUBEMG_AGENT_IMAGE=ghcr.io/kubemg/kubemg-agent:0.8.2
      - KUBEMG_AGENT_NAMESPACE=kubemg-system
      # Every exec and attach is recorded for replay from the audit trail. Turn
      # it off with KUBEMG_SESSION_RECORDING_ENABLED=false; the directory is the
      # mounted volume above, so recordings survive a rebuild.
      - KUBEMG_SESSION_RECORDING_ENABLED=true
      - KUBEMG_SESSION_RECORDING_DIR=/var/lib/kubemg/recordings
      # Recordings hold production shell output and keystrokes, so they are
      # encrypted at rest. No key is committed here on purpose: a key in git is
      # not a key. Generate one per install with `openssl rand -base64 32` and
      # put it in an untracked `.env` beside this file — out of the image, out of
      # git, and out of the backup that holds the recordings volume. Unset, the
      # server warns at boot and writes plaintext casts; losing a key that was
      # set means losing the recordings, which is the trade every at-rest
      # encryption makes.
      - KUBEMG_SESSION_RECORDING_KEY=${KUBEMG_SESSION_RECORDING_KEY:-}
      # Keystrokes are recorded as well as output. Set this to false where
      # operators type credentials into interactive tools: what is lost is exactly
      # what a prompt does not echo.
      - KUBEMG_SESSION_RECORDING_INPUT=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # -k because the certificate is self-signed by design here; the health
      # check is proving the process is up, not the trust chain.
      test: ["CMD", "curl", "-fsSk", "https://localhost:8443/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # frontend/package-lock.json carries only linux-x64 native bindings for
    # oxlint and rolldown (see CLAUDE.md). Pinned rather than left to
    # DOCKER_DEFAULT_PLATFORM so a plain `docker compose up`/`--build` on
    # Apple Silicon cannot silently rebuild this image arm64-native and
    # revive "Cannot find native binding". The backend must NOT get the same
    # pin — the Go compiler crashes under amd64 emulation.
    platform: linux/amd64
    container_name: kubemg-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # The image's own `npm ci` output, kept out of the way of the bind mount
      # above. It is a *named* volume rather than an anonymous one because its
      # contents are architecture-specific: native bindings installed on one
      # machine are wrong on another, and an anonymous volume survives
      # `docker compose down`, shadows the image's fresh copy forever and fails
      # with "Cannot find native binding" that points at the lockfile rather
      # than at the volume holding the stale install. Named, it is visible in
      # `docker volume ls` and `make reset` can drop it.
      - frontend-node-modules:/app/node_modules
    environment:
      # No VITE_API_BASE_URL: the SPA calls its own origin and vite proxies /api
      # to the backend, so opening the console from another machine works.
      - VITE_DEV_PROXY_TARGET=https://backend:8443
      # The dev proxy has to accept the self-signed certificate it just told
      # the backend to present.
      - VITE_DEV_PROXY_INSECURE=true
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
  tls-certs:
  session-recordings:
  go-mod-cache:
  go-build-cache:
