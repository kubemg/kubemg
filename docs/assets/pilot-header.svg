<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" role="img" aria-label="Explore's pilot header: 34 pods, 29 running, 3 not ready, 2 failed, 1.4 cores and 6 GiB in use, with named alerts for payments-api-7f9 in CrashLoopBackOff and ledger-worker-2 OOMKilled.">
  <style>
    .s { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .l { font-size: 10px; font-weight: 600; letter-spacing: 1.7px; }
    .b { font-size: 13px; }
    .c { font-size: 12px; }
  </style>

  <rect x="1" y="1" width="878" height="214" rx="12" fill="#1B1E22" stroke="#3A4033"/>

  <!-- The readings. Each number takes the tone of the state it counts; the
       label under it is the mono micro-cap the console uses. -->
  <text class="s n" x="32"  y="62" fill="#F2F3EF">34</text>
  <text class="s l" x="32"  y="84" fill="#8A9080">PODS</text>

  <text class="s n" x="132" y="62" fill="#7FB069">29</text>
  <text class="s l" x="132" y="84" fill="#8A9080">RUNNING</text>

  <text class="s n" x="262" y="62" fill="#E8A33D">3</text>
  <text class="s l" x="262" y="84" fill="#8A9080">NOT READY</text>

  <text class="s n" x="404" y="62" fill="#E4735C">2</text>
  <text class="s l" x="404" y="84" fill="#8A9080">FAILED</text>

  <!-- Utilisation is a reading, not a state, so it stays in the text ramp. -->
  <text class="s l" x="848" y="46" fill="#8A9080" text-anchor="end">IN USE</text>
  <text class="s b" x="848" y="70" fill="#F2F3EF" text-anchor="end">1.4 cores &#183; 6 GiB</text>
  <text class="s l" x="848" y="88" fill="#8A9080" text-anchor="end">OF 4 CORES &#183; 16 GIB</text>

  <line x1="16" y1="112" x2="864" y2="112" stroke="#3A4033"/>

  <text class="s b" x="32" y="140" fill="#F2F3EF">5 pods not running normally</text>

  <!-- Named alerts carry the cluster's own word, not a generic "not ready". -->
  <g class="s c">
    <rect x="31.5" y="158.5" width="266" height="30" rx="6" fill="#2B1714" stroke="#E4735C" stroke-opacity="0.45"/>
    <text x="46" y="178" fill="#F2F3EF">payments-api-7f9</text>
    <text x="176" y="178" fill="#E4735C">CrashLoopBackOff</text>

    <rect x="311.5" y="158.5" width="218" height="30" rx="6" fill="#2B1714" stroke="#E4735C" stroke-opacity="0.45"/>
    <text x="326" y="178" fill="#F2F3EF">ledger-worker-2</text>
    <text x="456" y="178" fill="#E4735C">OOMKilled</text>

    <text x="550" y="178" fill="#8A9080">and 3 more</text>
  </g>
</svg>
