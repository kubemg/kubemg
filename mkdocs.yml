site_name: kubemg
site_description: Centralised Kubernetes access, visibility and audit. No inbound ports; every call on the record.
site_url: https://kubemg.readthedocs.io/
repo_url: https://github.com/kubemg/kubemg
repo_name: kubemg/kubemg
edit_uri: edit/master/docs/
copyright: kubemg

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/kubemg-icon.svg
  favicon: assets/kubemg-icon.svg
  font:
    text: Archivo
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark

extra_css:
  - assets/kubemg.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# A link into a heading that has since been renamed is the failure mode a
# manual actually has, and mkdocs treats it as informational by default. Here
# it is a warning, which --strict and Read the Docs' fail_on_warning turn into
# a failed build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

plugins:
  - search

nav:
  - Home: index.md
  - User guide:
      - Get started:
          - What kubemg is: introduction/overview.md
          - Quickstart: getting-started/quickstart.md
      - Install:
          - Choosing a deployment: install/index.md
          - Docker Compose: install/docker-compose.md
          - Kubernetes: install/kubernetes.md
          - TLS and certificates: install/tls.md
          - Air-gapped installs: install/air-gapped.md
          - Upgrading: install/upgrading.md
          - Production checklist: install/production-checklist.md
      - Clusters:
          - Connection modes: clusters/connection-modes.md
          - Adding a cluster: clusters/registering.md
          - The agent: clusters/agent.md
          - Managing a cluster: clusters/managing.md
      - Working in a cluster:
          - Browsing resources: clusters/explore.md
          - Workload actions: clusters/actions.md
          - Terminals, shells and logs: clusters/terminals-and-logs.md
          - Helm: clusters/helm.md
          - Events timeline: clusters/events.md
          - Node capacity: clusters/capacity.md
          - Security posture: clusters/security-posture.md
      - Access:
          - The access model: access/model.md
          - Users and groups: access/users-and-groups.md
          - Single sign-on: access/sso.md
          - Kubeconfigs: access/kubeconfigs.md
          - Machine accounts: access/machine-accounts.md
          - Just-in-time access: access/jit.md
          - Command guardrails: access/guardrails.md
          - Cluster RBAC: access/rbac-visibility.md
      - Metrics and alerts:
          - Datasources: observability/datasources.md
          - Metrics and logs: observability/metrics-and-logs.md
          - Cluster alerts: observability/alerts.md
      - Audit:
          - Audit trail: audit/trail.md
          - Session recording: audit/session-recording.md
          - Alarms and integrations: audit/alarms.md
      - Reference:
          - Security model: introduction/security-model.md
          - Threat model: introduction/threat-model.md
          - Environment variables: install/environment.md
          - Runtime settings: reference/settings.md
          - Database: install/database.md
          - Prometheus metrics: install/metrics.md
          - Troubleshooting: reference/troubleshooting.md
  - Developer guide:
      - Start here: dev/index.md
      - Local development: dev/setup.md
      - Building and testing: dev/verify.md
      - Internals:
          - System architecture: dev/architecture.md
          - How a request flows: dev/request-flow.md
          - Backend: dev/backend.md
          - Tunnel and proxy: dev/bastion.md
          - Console: dev/frontend.md
          - The agent module: dev/agent.md
      - REST API: dev/api.md
      - Writing documentation: dev/docs.md
      - Contributing: dev/contributing.md
