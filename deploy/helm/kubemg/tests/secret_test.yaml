suite: the chart's Secret
templates:
  - secret.yaml
release:
  name: kubemg
  namespace: kubemg
values:
  - values/base.yaml
tests:
  - it: carries the database password it was given
    asserts:
      - equal:
          path: data.DB_PASSWORD
          value: dGVzdC1wYXNzd29yZA==

  - it: renders nothing when every value comes from an existing Secret
    set:
      database.password: ""
      database.existingSecret: kubemg-db
      secrets.existingSecret: kubemg-keys
      secrets.secretKey: ignored
    asserts:
      - hasDocuments:
          count: 0

  - it: carries only the keys it was given
    set:
      secrets.secretKey: a-key
    asserts:
      - exists:
          path: data.KUBEMG_SECRET_KEY
      - notExists:
          path: data.JWT_SECRET
      - notExists:
          path: data.KUBEMG_ADMIN_PASSWORD
