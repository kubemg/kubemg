# Granted nothing, and its token is not mounted: KubeMG reaches clusters through
# agents' tunnels or the credentials an administrator registers, never through
# the API server of the cluster it happens to run in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubemg.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemg.labels" . | nindent 4 }}
automountServiceAccountToken: false
