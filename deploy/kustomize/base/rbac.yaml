apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemg-agent
  namespace: __AGENT_NAMESPACE__
---
# The agent itself holds almost nothing: its only privilege is the right to say
# "act as this user, in these groups". Whatever the impersonated subject may do
# is decided by the bindings below and by the cluster's own RBAC — the agent
# never gets a standing grant over your workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemg-agent-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  # Read the API server version for the handshake, so KubeMG can show the
  # cluster's Kubernetes version without a second connection.
  - nonResourceURLs: ["/version", "/version/"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-agent-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemg-agent-impersonator
subjects:
  - kind: ServiceAccount
    name: kubemg-agent
    namespace: __AGENT_NAMESPACE__
---
# KubeMG asserts one group per grant level. Binding them to the built-in
# ClusterRoles is what finally makes a KubeMG permission mean something inside
# the cluster: a "view" grant now really is read-only here, not just in the UI.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:cluster-admin
---
# Which CRDs a cluster has is what the Explore sidebar is built from, and the
# built-in view role does not cover them: reading the *definitions* is inventory
# — a schema, not the data any of them hold — so it is granted to every subject
# that reaches the cluster at all. Without this a "view" grant browses a sidebar
# with no custom resources in it and no explanation for their absence.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemg-crd-discovery
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-crd-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemg-crd-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:users
---
# Reading the objects those CRDs serve is a second gap: the built-in view role
# covers the API groups Kubernetes ships with, and a CRD is only picked up by it
# if its author labelled a ClusterRole `aggregate-to-view`, which most do not.
#
# The groups are enumerated rather than wildcarded on purpose. `apiGroups: ["*"]`
# would include the core group, and the core group is where Secrets live — a
# blanket read here would hand every KubeMG user every secret in the cluster,
# which is the opposite of what a "view" grant means. So this lists the APIs
# KubeMG surfaces as first-class views, and nothing else.
#
# To browse another operator's CRDs, add its API group below and re-apply. The
# generic list and the YAML editor work for any CRD; this is the only thing
# standing between them and a kind KubeMG has never heard of.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemg-custom-resource-view
rules:
  - apiGroups:
      - "gateway.networking.k8s.io"
      - "networking.istio.io"
      - "security.istio.io"
      - "telemetry.istio.io"
      - "extensions.istio.io"
      - "install.istio.io"
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
# Bound to kubemg:users rather than kubemg:view because every grant level is at
# least a view, and every proxied call carries this group. Namespace scope is
# still enforced by the bastion, which the cluster cannot express.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-custom-resource-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemg-custom-resource-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:users
---
# The write half, so an "edit" grant can apply an edited manifest for the same
# kinds it can read. cluster-admin already covers this; view deliberately does
# not get it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemg-custom-resource-edit
rules:
  - apiGroups:
      - "gateway.networking.k8s.io"
      - "networking.istio.io"
      - "security.istio.io"
      - "telemetry.istio.io"
      - "extensions.istio.io"
      - "install.istio.io"
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-custom-resource-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemg-custom-resource-edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:edit
---
# Every proxied call also carries kubemg:users. Discovery is what kubectl needs
# before it can resolve a single resource, so grant it here rather than leaving
# a "view" user unable to run `kubectl api-resources`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemg-users-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubemg:users
---
# The browser shell's own service account.
#
# It is granted nothing, anywhere, and its token is not mounted into the pod
# either. That is not belt-and-braces caution — it is the feature's central
# rule. A KubeMG shell holds no cluster credential of its own: everything it can
# do arrives as a kubeconfig pointing back at KubeMG's proxy, carrying the
# *operator's* identity, so every command it runs is impersonated as that person
# and answered by this cluster's RBAC. A shell that could act as a service
# account here would be a way around the tunnel, which is the one thing this
# feature must never become.
#
# It exists at all so the pod does not fall back to `default`, which on a lot of
# clusters has bindings nobody remembers adding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemg-shell
  namespace: __AGENT_NAMESPACE__
automountServiceAccountToken: false
---
# What KubeMG itself may do to run those shells.
#
# Creating a shell pod cannot be authorized by the operator's own grant: a
# read-only user cannot create a pod, and the pod lives in KubeMG's namespace
# rather than in theirs. So KubeMG impersonates a name of its own for the
# lifecycle — creating the pod, writing the kubeconfig into it over an exec,
# stamping its idle clock, deleting it — while the audit trail records the
# person who asked. Both halves are true and both are on the record.
#
# It is a Role rather than a ClusterRole, and bound to a *user* rather than to
# one of the kubemg: groups, so it reaches exactly one namespace and cannot be
# picked up by anybody's grant level.
#
# `pods/exec` here is what a scanner flags (Trivy KSV-0053) and what the feature
# is: exec into a pod with a privileged service account is a standard path to
# cluster-admin, and the shell pod deliberately has no service account token at
# all. See .trivyignore for the full argument and for the residual it does not
# cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemg-shell-runner
  namespace: __AGENT_NAMESPACE__
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Both verbs, because an exec is opened over a WebSocket and a WebSocket
    # begins as a GET: the API server authorizes that as `get` on the
    # subresource, not as `create`. `create` alone is what SPDY asked for, and it
    # answers a websocket exec with 403 — which is a shell whose pod starts and
    # whose kubeconfig can never be written into it. The built-in `edit` role
    # every operator reaches the cluster through carries both for the same
    # reason.
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubemg-shell-runner
  namespace: __AGENT_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubemg-shell-runner
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kubemg:shell-runner
