# The agent's entire configuration. cluster-token is the registration secret
# KubeMG minted for this one cluster: it authenticates the outbound tunnel and
# nothing else, and revoking the cluster in KubeMG makes it useless.
apiVersion: v1
kind: Secret
metadata:
  name: kubemg-agent
  namespace: __AGENT_NAMESPACE__
type: Opaque
stringData:
  bastion-url: __BASTION_URL__
  cluster-token: __CLUSTER_TOKEN__
data:
  # The bastion's CA, base64-encoded because a PEM block is multi-line and a
  # YAML scalar is not. Empty when the bastion presents a certificate the
  # agent's system roots already trust; the agent reads an empty value as
  # "trust the system roots", so the key is always present and the manifest has
  # one shape rather than two.
  bastion-ca: __BASTION_CA__
