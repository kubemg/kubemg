name: CLA

# Every outside contribution is accepted under CLA.md, because KubeMG is offered
# under a commercial licence beside the AGPL and the author can only license
# code they hold the right to (see NOTICE). This bot asks each new contributor
# to accept the agreement once, by commenting on their pull request, and records
# the acceptance; a pull request with a contributor who has not accepted it gets
# a failing `CLAAssistant` status.
#
# It runs on `pull_request_target` so it can comment on and set a status for a
# pull request opened from a fork — which a `pull_request` run cannot, having a
# read-only token there. That event runs with the base repository's token, so
# this workflow must never check out or execute anything from the pull request:
# it reads only the list of committers through the API.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

# One list, read by both jobs: the CLA action exempts these committers, and the
# Commit authors job refuses a commit that borrows one of them. Kept here so the
# two cannot drift.
env:
  # The copyright holder does not license their own work to themselves, and a
  # bot is not an author.
  CLA_ALLOWLIST: 'ozkanpoyrazoglu,*[bot]'

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    # A comment only matters on a pull request, and only when it is the
    # signature or a request to check again.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # Pinned to the v2.6.1 commit rather than the tag: this step holds a
        # write token, so what it runs must not change under a moved tag.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/kubemg/kubemg/blob/master/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          # Signatures live on their own unprotected branch: the bot commits
          # each acceptance, and master only takes changes through review.
          branch: 'cla-signatures'
          allowlist: ${{ env.CLA_ALLOWLIST }}
          signed-commit-message: '$contributorName accepted the CLA in $owner/$repo#$pullRequestNo'
          create-file-commit-message: 'Start the record of CLA acceptances'
          custom-notsigned-prcomment: >-
            Thank you for this contribution. KubeMG is offered under a commercial
            licence as well as the AGPL, so every contribution is accepted under
            the [Contributor Licence Agreement](https://github.com/kubemg/kubemg/blob/master/CLA.md).
            You keep your copyright, and the project stays open source. Please read
            it, then accept it by commenting with the exact sentence below. You
            only need to do this once, and it also covers anything you contributed
            before.
          custom-allsigned-prcomment: 'Every contributor on this pull request has accepted the CLA.'
          lock-pullrequest-aftermerge: false

  # The CLA action decides who wrote a commit from the commit's own metadata,
  # which the contributor writes. Two ways through it are closed here:
  #
  # - An author email linked to no account has no login, and the action falls
  #   back to the author *name* in git, which anyone can set. A commit authored
  #   as `x[bot]`, or under any name on the allowlist, would pass without an
  #   agreement. Such a commit fails here.
  # - An author email linked to an allowlisted account resolves to that account
  #   whoever wrote the commit. The owner's address is in every commit they
  #   made public. So an allowlisted author counts only on a pull request that
  #   account opened itself. The one exception is a merge commit GitHub signed
  #   (`web-flow`, two parents): that is the owner pressing "Update branch" on
  #   someone else's pull request.
  #
  # What it does not close: a commit authored under the linked email of
  # somebody who *signed* the CLA still reads as theirs. That is the CLA
  # action's model, and a signature commits the signer, not this check.
  #
  # Same rule as the job above: it runs with the base repository's workflow and
  # token, reads the commits through the API, and never checks out or runs
  # anything from the pull request. Its token can only read.
  CommitAuthors:
    name: Commit authors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every commit is authored by its own GitHub account
        # Values reach the script through env, never written into it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OPENER: ${{ github.event.pull_request.user.login }}
          # The event's own SHAs, not the pull request's live head: the result
          # is attached to this head, so it must describe exactly these
          # commits, not ones pushed after the event.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          range="repos/$REPO/compare/$BASE_SHA...$HEAD_SHA"
          total=$(gh api "$range?per_page=1" --jq '.total_commits')
          commits=$(gh api --paginate "$range?per_page=100" --jq '.commits[]' | jq -s '.')
          listed=$(jq 'length' <<<"$commits")
          if [ "$listed" -ne "$total" ]; then
            echo "::error title=Commit authors::The API listed $listed of this pull request's $total commits, so the rest cannot be checked. Squash or split it."
            exit 1
          fi

          # A commit is refused when its author resolves to no account, or to
          # an allowlisted account other than the one that opened the pull
          # request (a GitHub-signed merge excepted). Allowlist patterns match
          # as the CLA action matches them: exact, or a `*` glob tested
          # unanchored, so nothing it would exempt is missed here.
          refused=$(jq -r --arg opener "$OPENER" --arg allow "$CLA_ALLOWLIST" '
            def esc: gsub("(?<c>[.\\[\\]()+?^$|{}\\\\])"; "\\\(.c)");
            def allowlisted($login):
              [ $allow | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(. != "")
                | . as $p | if contains("*") then ($login | test($p | esc | gsub("\\*"; ".*")))
                  else $p == $login end ]
              | any;
            def signed_merge:
              (.parents | length) >= 2
              and .commit.verification.verified == true
              and (.committer.login // "") == "web-flow";
            .[]
            | (.author.login // "") as $login
            | if $login == "" then
                "\(.sha[0:7]) author linked to no GitHub account: \(.commit.author.name) <\(.commit.author.email)>"
              elif allowlisted($login) and $login != $opener and (signed_merge | not) then
                "\(.sha[0:7]) authored as \($login), which is exempt from the CLA, in a pull request opened by \($opener)"
              else empty end
          ' <<<"$commits")

          if [ -z "$refused" ]; then
            echo "Every one of the $total commits is authored by its own GitHub account."
            exit 0
          fi

          # The names and emails are the contributor's own text. Printed with
          # workflow commands suspended, a name shaped like `::add-mask::` or
          # `::stop-commands::` is shown, not obeyed.
          resume=$(openssl rand -hex 16)
          echo "::stop-commands::$resume"
          echo "Refused commits:"
          echo "$refused"
          echo "::$resume::"

          count=$(printf '%s\n' "$refused" | wc -l | tr -d ' ')
          echo "::error title=Commit authors::$count commit(s) refused; the log lists them. A commit must be authored with an email linked to your own GitHub account. Add the email under Settings > Emails, or set git's user.email to an address already there (your GitHub noreply address works), then rewrite the commits (git rebase --exec 'git commit --amend --no-edit --reset-author' origin/dev) and force-push the branch."
          exit 1
