version: 2
updates:
  # Keeps pr-checks.yml's pinned action versions (trivy-action,
  # gitleaks-action, checkout, ...) current via PRs of their own, rather than
  # the pipeline quietly drifting behind upstream fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Work lands on dev and master takes only dev or a hotfix branch, so an
    # update opened against master fails "Only dev reaches master" and cannot
    # merge. Open them where every other change goes.
    target-branch: dev
    # Every action is pinned to a commit, and a pin is only as good as the
    # release it names. A week's wait lets a compromised or yanked release be
    # caught upstream before a PR proposes it here.
    cooldown:
      default-days: 7
