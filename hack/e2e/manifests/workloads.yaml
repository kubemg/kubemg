# The namespace the scoped `view` user is granted, and a Deployment with more
# than one replica in it. The image is `pause`: it runs, turns Ready, and has no
# shell — which makes it the pod the Debug action exists for as well.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-web
  namespace: e2e-apps
  labels:
    app: e2e-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e2e-web
  template:
    metadata:
      labels:
        app: e2e-web
    spec:
      # Non-root is declared on the container, not the pod: a pod-level
      # runAsNonRoot is inherited by the Debug action's ephemeral container,
      # and its default image (busybox) runs as root — the kubelet would refuse
      # to start it, and this is the pod the Debug action is exercised against.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65535
            runAsGroup: 65535
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
