# The namespace the scoped `view` user is granted, and a Deployment with more
# than one replica in it. The image is `pause`: it runs, turns Ready, and has no
# shell — which makes it the pod the Debug action exists for as well.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-web
  namespace: e2e-apps
  labels:
    app: e2e-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e2e-web
  template:
    metadata:
      labels:
        app: e2e-web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
