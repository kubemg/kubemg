title = "KubeMG gitleaks config"

# Start from gitleaks' own maintained ruleset and only add what this repo
# needs on top of it, rather than hand-maintaining detection rules.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures use short, obviously fake credentials, not real secrets"
paths = [
  '''.*_test\.go$''',
  '''.*\.test\.tsx?$''',
  # The Helm chart's CI value sets: rendered by `make chart-test`, never
  # installed. Their keys are fixtures shaped like what an operator supplies.
  '''^deploy/helm/kubemg/ci/[^/]+-values\.yaml$''',
]
